<div class="container mt-5">
  <h2>Registro</h2>

  <form (ngSubmit)="register()">

    <div class="mb-3">
      <label>Nombre de usuario</label>
      <input type="text" class="form-control" [(ngModel)]="username" name="username">
    </div>

    <div class="mb-3">
      <label>Nombre</label>
      <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre">
    </div>

    <div class="mb-3">
      <label>Apellidos</label>
      <input type="text" class="form-control" [(ngModel)]="apellidos" name="apellidos">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" name="email">
    </div>

    <div class="mb-3">
      <label>Dirección</label>
      <input type="text" class="form-control" [(ngModel)]="direccion" name="direccion">
    </div>

    <div class="mb-3">
      <label>Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="password" name="password">
    </div>

    <button class="btn btn-primary" type="submit">Registrarse</button>
  </form>
</div>
