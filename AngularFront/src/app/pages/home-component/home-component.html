<div class="escaparate-eventos">
  <h2 class="titulo-destacados">Eventos Destacados</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 cuadricula-destacados">

    @for (evento of eventos; track evento.idEvento) {
    <div class="col item-destacado">
      <app-eventocard-component [evento]="evento"></app-eventocard-component>
    </div>
    } @empty {
    <div class="col-12 contenedor-vacio-inicio">
      <p class="texto-vacio-inicio">No hay eventos disponibles en este momento.</p>
    </div>
    }

  </div>
</div>
